# BlogSpace API — Render Blueprint
# Repo: meherabnowshad/SDET-b19 (monorepo, service lives in Assignment06/backend)
# Usage: Render Dashboard → New → Blueprint → select repo → Blueprint path: Assignment06/render.yaml
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: blogspace-api
    runtime: node
    rootDir: Assignment06/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.23.1
      - key: PORT
        value: 5001
      # --- MySQL (use external host: Aiven / Railway / Clever Cloud) ---
      # Render has no managed MySQL; create one externally, then paste values in dashboard.
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        value: blogdb
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      # --- Auth ---
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: JWT_RESET_EXPIRES_IN
        value: 1h
      # --- URLs / Mail / Admin ---
      # Set AFTER Vercel deploy, e.g. https://blogspace.vercel.app
      - key: FRONTEND_URL
        sync: false
      - key: GMAIL
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_FIRSTNAME
        value: Admin
      - key: ADMIN_LASTNAME
        value: One
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

# NOTE:
# 1. Tables auto-create on boot via initDB() (sequelize.sync) in server.js — no db:setup needed on Render.
# 2. After first deploy, run once via Render → Shell: npm run seed:admin
# 3. /uploads is local disk (multer diskStorage) and ephemeral on Render free tier.
#    Avatars work for demo but reset on redeploy. For persistence use Cloudinary/S3.
