services:
  backend:
    build: ./backend
    container_name: blog-backend
    ports:
      - "5001:5001"
    env_file:
      - ./backend/.env
    environment:
      # .env has DB_HOST=localhost (the container itself) — override so the
      # container reaches MySQL running on your Mac.
      - DB_HOST=host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist uploaded avatars across restarts
      - backend-uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Baked into `next build`. Browser calls this URL, so keep it as
        # localhost:5001 (not the compose service name).
        NEXT_PUBLIC_API_URL: http://localhost:5001/api
    container_name: blog-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5001/api
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-uploads:
